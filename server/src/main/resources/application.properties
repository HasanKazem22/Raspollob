spring.application.name=raspollob-server

# Secrets are never stored in this file.
# - Local development: put them in server/.env (git-ignored, loaded below).
# - Staging / production: set them as environment variables (see deploy/env.example).
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (base64-encoded, at least 32 bytes: openssl rand -base64 48)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend origin allowed by CORS (production serves both on one domain behind Nginx)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# File uploads (multiple images up to 30MB per request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=${UPLOAD_DIR:uploads}

server.port=${SERVER_PORT:8085}
# Running behind Nginx: trust its X-Forwarded-* headers
server.forward-headers-strategy=framework
