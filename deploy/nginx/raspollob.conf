# Nginx on the VPS: one domain per environment.
# Replace raspollob.com / staging.raspollob.com with your domains, then:
#   sudo cp raspollob.conf /etc/nginx/sites-available/raspollob.conf
#   sudo ln -s /etc/nginx/sites-available/raspollob.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d raspollob.com -d www.raspollob.com -d staging.raspollob.com   (free HTTPS)

# ── Production (branch main) ───────────────────────────────────────────
server {
    listen 80;
    server_name raspollob.com www.raspollob.com;

    client_max_body_size 30M;   # product photo uploads

    # API and uploaded photos → Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/raspollob-proxy.conf;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/raspollob-proxy.conf;
        expires 30d;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/raspollob-proxy.conf;
    }
}

# ── Staging (branch develop) ───────────────────────────────────────────
server {
    listen 80;
    server_name staging.raspollob.com;

    client_max_body_size 30M;

    location /api/ {
        proxy_pass http://127.0.0.1:8086;
        include /etc/nginx/snippets/raspollob-proxy.conf;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8086;
        include /etc/nginx/snippets/raspollob-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/raspollob-proxy.conf;
    }
}
