# One stack per environment on the VPS:
#   /opt/raspollob/production  (APP_ENV=production, branch main)
#   /opt/raspollob/staging     (APP_ENV=staging,    branch develop)
# Each folder holds a copy of this file plus its own .env (see env.example).
# Every stack has its own database and photo storage: staging can never touch live data.
# GitHub Actions copies this file and runs `docker compose pull && docker compose up -d` on every deploy.

name: raspollob-${APP_ENV}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Dhaka
    volumes:
      # All shop data lives here and survives every deploy and restart
      - pgdata:/var/lib/postgresql/data
    # No published port: only the server container can reach the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  server:
    image: ghcr.io/${IMAGE_OWNER}/raspollob-server:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOAD_DIR: /app/uploads
      # Dates entered in admin (offers, promo codes) are Bangladesh time
      TZ: Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Product photos survive every deploy
      - uploads:/app/uploads
    ports:
      # Only reachable from the VPS itself; Nginx is the public entrance
      - "127.0.0.1:${SERVER_PORT}:8085"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  gui:
    image: ghcr.io/${IMAGE_OWNER}/raspollob-gui:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:${GUI_PORT}:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
  uploads:
